[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optalgo"
version = "1.0.0"
description = "Pipe-network design (MST) and time-limited trip planning, with tests and benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soroush Daneshpour" }]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
optalgo = "optalgo.cli:main"

[tool.setuptools]
packages = ["optalgo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
